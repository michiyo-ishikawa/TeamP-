<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="声掛け管理">
<title>イベント声掛け・出欠管理</title>

<!-- Firebase (compat SDK) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<!-- Excel出力 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
  :root{
    --main:#2c6e6b;
    --main-dark:#1f4f4d;
    --accent:#e07a3f;
    --bg:#f4f6f5;
    --card:#ffffff;
    --border:#dde3e1;
    --text:#25302e;
    --muted:#78857f;
    --danger:#c0453a;
    --ok:#2c7a3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:70px;
  }
  header{
    background:linear-gradient(135deg,var(--main),var(--main-dark));
    color:#fff; padding:16px 16px 12px; position:sticky; top:0; z-index:50;
  }
  header h1{margin:0; font-size:18px; font-weight:700;}
  header .sub{font-size:11px; opacity:.85; margin-top:2px;}
  #syncStatus{font-size:11px; margin-top:6px; display:inline-block; padding:2px 8px; border-radius:10px; background:rgba(255,255,255,.15);}
  #syncStatus.saving{background:rgba(255,200,0,.3);}
  #syncStatus.error{background:rgba(255,80,80,.4);}

  nav.tabs{
    display:flex; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:64px; z-index:49;
  }
  nav.tabs button{
    flex:1; padding:12px 4px; border:none; background:none; font-size:13px;
    color:var(--muted); font-weight:600; border-bottom:3px solid transparent; cursor:pointer;
  }
  nav.tabs button.active{ color:var(--main); border-bottom-color:var(--main); }

  main{padding:12px;}
  .panel{display:none;}
  .panel.active{display:block;}

  .toolbar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
  .toolbar input[type=text], .toolbar input[type=search]{
    flex:1; min-width:140px; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;
  }
  select{padding:8px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:#fff;}
  .btn{
    background:var(--main); color:#fff; border:none; padding:9px 14px; border-radius:8px;
    font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .btn.secondary{background:#fff; color:var(--main); border:1px solid var(--main);}
  .btn.danger{background:var(--danger);}
  .btn.small{padding:5px 10px; font-size:12px;}
  .btn.accent{background:var(--accent);}
  .btn:disabled{opacity:.5;}

  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:10px;
  }
  .card h3{margin:0 0 4px; font-size:15px;}
  .card .meta{font-size:12px; color:var(--muted); line-height:1.6;}
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; margin-right:4px; margin-top:4px;}
  .tag.org{background:#e8f2f0; color:var(--main-dark);}
  .tag.count{background:#fbeee3; color:#a24d1e;}
  .tag.attend{background:#e6f4e9; color:var(--ok);}
  .tag.noattend{background:#fdeceb; color:var(--danger);}

  .empty{text-align:center; color:var(--muted); padding:40px 10px; font-size:14px;}

  /* modal */
  .modal-bg{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:100;
    align-items:flex-end; justify-content:center;
  }
  .modal-bg.active{display:flex;}
  .modal{
    background:#fff; width:100%; max-width:520px; max-height:92vh; overflow-y:auto;
    border-radius:16px 16px 0 0; padding:18px 16px 24px; animation:slideup .18s ease-out;
  }
  @media(min-width:600px){
    .modal-bg{align-items:center;}
    .modal{border-radius:16px; max-height:88vh;}
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal h2{margin:0 0 14px; font-size:17px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px; font-family:inherit;
  }
  .field textarea{resize:vertical; min-height:50px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .modal-actions{display:flex; gap:8px; margin-top:16px;}
  .modal-actions .btn{flex:1;}
  .close-x{position:absolute; top:14px; right:14px; background:none; border:none; font-size:20px; color:var(--muted); cursor:pointer;}
  .modal{position:relative;}

  /* participant selection */
  .plist{border:1px solid var(--border); border-radius:10px; max-height:340px; overflow-y:auto;}
  .prow{padding:10px; border-bottom:1px solid var(--border); display:flex; gap:8px; align-items:flex-start;}
  .prow:last-child{border-bottom:none;}
  .prow input[type=checkbox]{margin-top:4px; width:18px; height:18px;}
  .prow .pinfo{flex:1;}
  .prow .pname{font-weight:600; font-size:14px;}
  .prow .pmeta{font-size:11px; color:var(--muted);}
  .pdetail{margin-top:8px; padding:10px; background:#f8faf9; border-radius:8px; display:none;}
  .pdetail.open{display:block;}
  .pdetail .row2{grid-template-columns:1fr 1fr;}
  .pdetail .field{margin-bottom:8px;}
  .pdetail label{font-size:11px;}

  .fab{
    position:fixed; right:18px; bottom:24px; width:54px; height:54px; border-radius:50%;
    background:var(--accent); color:#fff; font-size:26px; border:none; box-shadow:0 4px 12px rgba(0,0,0,.25);
    cursor:pointer; z-index:40; line-height:54px; text-align:center;
  }

  #toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:#333; color:#fff; padding:9px 18px; border-radius:20px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:200;
  }
  #toast.show{opacity:1;}

  .export-section{margin-bottom:18px;}
  .export-section h3{font-size:14px; margin-bottom:8px;}
  .export-buttons{display:flex; gap:8px; flex-wrap:wrap;}

  table.printtable{border-collapse:collapse; width:100%; font-size:12px;}
  table.printtable th, table.printtable td{border:1px solid #999; padding:5px 7px; text-align:left;}
  table.printtable th{background:#eee;}

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; left:0; top:0; width:100%;}
  }
</style>
</head>
<body>

<header>
  <h1>イベント声掛け・出欠管理</h1>
  <div class="sub">主旨・メンバーが異なるイベントの基本情報と声掛け選定用データを管理</div>
  <span id="syncStatus">同期待機中…</span>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="events">① イベント</button>
  <button class="tab-btn" data-tab="members">② メンバー</button>
  <button class="tab-btn" data-tab="export">③ 出力</button>
</nav>

<main>

  <!-- ===== イベント タブ ===== -->
  <section id="tab-events" class="panel active">
    <div class="toolbar">
      <input type="search" id="eventSearch" placeholder="イベント名・主催・主旨で検索">
    </div>
    <div id="eventList"></div>
  </section>

  <!-- ===== メンバー タブ ===== -->
  <section id="tab-members" class="panel">
    <div class="toolbar">
      <input type="search" id="memberSearch" placeholder="氏名・所属・業種で検索">
    </div>
    <div class="toolbar">
      <select id="filterOrg"><option value="">所属：すべて</option></select>
      <select id="filterIndustry"><option value="">業種：すべて</option></select>
      <select id="filterAge"><option value="">年代：すべて</option></select>
      <select id="filterHistory">
        <option value="">参加履歴：すべて</option>
        <option value="has">参加あり</option>
        <option value="none">参加なし（未声掛け候補）</option>
      </select>
    </div>
    <div id="memberList"></div>
  </section>

  <!-- ===== 出力 タブ ===== -->
  <section id="tab-export" class="panel">
    <div class="export-section card">
      <h3>メンバー名簿</h3>
      <div class="export-buttons">
        <button class="btn" onclick="exportMembersExcel()">Excel出力</button>
        <button class="btn secondary" onclick="printMembers()">印刷 / PDF保存</button>
      </div>
    </div>
    <div class="export-section card">
      <h3>イベント一覧（全件・シリーズ横断）</h3>
      <div class="export-buttons">
        <button class="btn" onclick="exportAllEventsExcel()">Excel出力（イベント別シート付き）</button>
      </div>
    </div>
    <div class="export-section card">
      <h3>特定イベントの参加者リスト</h3>
      <div class="field">
        <select id="exportEventSelect"></select>
      </div>
      <div class="export-buttons">
        <button class="btn" onclick="exportSingleEventExcel()">Excel出力</button>
        <button class="btn secondary" onclick="printSingleEvent()">印刷 / PDF保存</button>
      </div>
    </div>
  </section>

</main>

<button class="fab" id="fabAdd">＋</button>

<div id="toast"></div>
<div id="printArea" style="display:none;"></div>

<!-- ===== イベント編集モーダル ===== -->
<div class="modal-bg" id="eventModalBg">
  <div class="modal">
    <button class="close-x" onclick="closeModal('eventModalBg')">×</button>
    <h2 id="eventModalTitle">新規イベント</h2>
    <input type="hidden" id="eventId">
    <div class="field"><label>イベント名 *</label><input type="text" id="eventName"></div>
    <div class="row2">
      <div class="field"><label>開催日</label><input type="date" id="eventDate"></div>
      <div class="field"><label>場所</label><input type="text" id="eventVenue"></div>
    </div>
    <div class="field"><label>主催</label><input type="text" id="eventOrganizer"></div>
    <div class="field"><label>主旨・目的</label><textarea id="eventPurpose"></textarea></div>
    <div class="field"><label>メモ</label><textarea id="eventMemo"></textarea></div>
    <div class="modal-actions">
      <button class="btn danger" id="eventDeleteBtn" style="display:none;" onclick="deleteEvent()">削除</button>
      <button class="btn" onclick="saveEvent()">保存</button>
    </div>
  </div>
</div>

<!-- ===== イベント詳細（声掛け選定・出欠管理）モーダル ===== -->
<div class="modal-bg" id="eventDetailModalBg">
  <div class="modal">
    <button class="close-x" onclick="closeModal('eventDetailModalBg')">×</button>
    <h2 id="eventDetailTitle">イベント詳細</h2>
    <div class="meta" id="eventDetailMeta" style="margin-bottom:10px;"></div>
    <button class="btn secondary small" onclick="editCurrentEventInfo()">基本情報を編集</button>
    <hr style="margin:14px 0; border:none; border-top:1px solid var(--border);">
    <div class="toolbar">
      <input type="search" id="detailMemberSearch" placeholder="メンバーを検索して声掛け対象に追加">
      <select id="detailFilterOrg"><option value="">所属：すべて</option></select>
    </div>
    <div class="plist" id="detailPlist"></div>
  </div>
</div>

<!-- ===== メンバー編集モーダル ===== -->
<div class="modal-bg" id="memberModalBg">
  <div class="modal">
    <button class="close-x" onclick="closeModal('memberModalBg')">×</button>
    <h2 id="memberModalTitle">新規メンバー</h2>
    <input type="hidden" id="memberId">
    <div class="field"><label>氏名 *</label><input type="text" id="memberName"></div>
    <div class="field"><label>所属</label><input type="text" id="memberOrg"></div>
    <div class="row2">
      <div class="field"><label>業種</label><input type="text" id="memberIndustry"></div>
      <div class="field"><label>年代</label>
        <select id="memberAge">
          <option value=""></option>
          <option>20代</option><option>30代</option><option>40代</option>
          <option>50代</option><option>60代</option><option>70代以上</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>性別</label>
        <select id="memberGender"><option value=""></option><option>女性</option><option>男性</option><option>その他</option></select>
      </div>
      <div class="field"><label>お酒</label>
        <select id="memberDrink"><option value=""></option><option>〇 飲む</option><option>× 飲まない</option><option>不明</option></select>
      </div>
    </div>
    <div class="field"><label>連絡先（TEL / メール）</label><input type="text" id="memberContact"></div>
    <div class="field"><label>紹介者・声掛け経路</label><input type="text" id="memberReferrer"></div>
    <div class="field"><label>備考（アレルギー・嗜好など）</label><textarea id="memberNote"></textarea></div>
    <div class="modal-actions">
      <button class="btn danger" id="memberDeleteBtn" style="display:none;" onclick="deleteMember()">削除</button>
      <button class="btn" onclick="saveMember()">保存</button>
    </div>
  </div>
</div>

<script>
/* ==========================================================
   Firebase設定
   ↓↓↓ ここに実際の値を貼り付けてください ↓↓↓
   Firebaseコンソール > プロジェクトの設定 > 全般 > マイアプリ
   「piriri-members」プロジェクトのSDK設定と構成からコピーします
   ========================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyBmsl8JeuEglJKIdU5_lDcqDkk0nxLCMJc",
  authDomain: "piriri-members.firebaseapp.com",
  projectId: "piriri-members",
  storageBucket: "piriri-members.firebasestorage.app",
  messagingSenderId: "420912189594",
  appId: "1:420912189594:web:0950020a601232ad3e4f23"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// このアプリ専用のコレクション/ドキュメント（他アプリのデータとは独立）
const docRef = db.collection('eventAttendance').doc('main');

let appState = { members: [], events: [] };
let isRemoteUpdate = false;
let currentEventId = null; // イベント詳細モーダルで開いているイベント

const genderIcon = {};

function setStatus(text, cls){
  const el = document.getElementById('syncStatus');
  el.textContent = text;
  el.className = cls || '';
}

// ---------- Firestore リアルタイム同期 ----------
docRef.onSnapshot((doc) => {
  if(doc.exists){
    appState = doc.data();
    appState.members = appState.members || [];
    appState.events = appState.events || [];
  } else {
    appState = { members: [], events: [] };
    docRef.set(appState);
  }
  setStatus('同期済み ✓');
  renderAll();
}, (err) => {
  console.error(err);
  setStatus('同期エラー：Firebase設定を確認してください', 'error');
});

function saveState(){
  setStatus('保存中…', 'saving');
  docRef.set(appState)
    .then(()=> setStatus('同期済み ✓'))
    .catch((e)=>{ console.error(e); setStatus('保存エラー', 'error'); alert('保存に失敗しました。通信環境をご確認ください。\n' + e.message); });
}

function genId(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

// ---------- タブ切り替え ----------
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab === 'export') populateExportEventSelect();
  });
});

function closeModal(id){ document.getElementById(id).classList.remove('active'); }
function openModal(id){ document.getElementById(id).classList.add('active'); }

// ---------- FABボタン（現在のタブに応じて新規追加） ----------
document.getElementById('fabAdd').addEventListener('click', ()=>{
  const active = document.querySelector('.tab-btn.active').dataset.tab;
  if(active === 'events') openNewEventModal();
  else if(active === 'members') openNewMemberModal();
});

// ============================================================
//  イベント関連
// ============================================================
function openNewEventModal(){
  document.getElementById('eventModalTitle').textContent = '新規イベント';
  document.getElementById('eventId').value = '';
  document.getElementById('eventName').value = '';
  document.getElementById('eventDate').value = '';
  document.getElementById('eventVenue').value = '';
  document.getElementById('eventOrganizer').value = '';
  document.getElementById('eventPurpose').value = '';
  document.getElementById('eventMemo').value = '';
  document.getElementById('eventDeleteBtn').style.display = 'none';
  openModal('eventModalBg');
}

function openEditEventModal(id){
  const ev = appState.events.find(e=>e.id===id);
  if(!ev) return;
  document.getElementById('eventModalTitle').textContent = 'イベント編集';
  document.getElementById('eventId').value = ev.id;
  document.getElementById('eventName').value = ev.name || '';
  document.getElementById('eventDate').value = ev.date || '';
  document.getElementById('eventVenue').value = ev.venue || '';
  document.getElementById('eventOrganizer').value = ev.organizer || '';
  document.getElementById('eventPurpose').value = ev.purpose || '';
  document.getElementById('eventMemo').value = ev.memo || '';
  document.getElementById('eventDeleteBtn').style.display = 'inline-block';
  openModal('eventModalBg');
}

function editCurrentEventInfo(){
  closeModal('eventDetailModalBg');
  openEditEventModal(currentEventId);
}

function saveEvent(){
  const name = document.getElementById('eventName').value.trim();
  if(!name){ alert('イベント名を入力してください'); return; }
  const id = document.getElementById('eventId').value;
  const data = {
    name,
    date: document.getElementById('eventDate').value,
    venue: document.getElementById('eventVenue').value.trim(),
    organizer: document.getElementById('eventOrganizer').value.trim(),
    purpose: document.getElementById('eventPurpose').value.trim(),
    memo: document.getElementById('eventMemo').value.trim(),
  };
  if(id){
    const ev = appState.events.find(e=>e.id===id);
    Object.assign(ev, data);
  } else {
    appState.events.unshift({ id: genId(), participants: [], createdAt: Date.now(), ...data });
  }
  saveState();
  closeModal('eventModalBg');
  showToast('保存しました');
}

function deleteEvent(){
  const id = document.getElementById('eventId').value;
  if(!confirm('このイベントを削除しますか？参加者記録も削除されます。')) return;
  appState.events = appState.events.filter(e=>e.id!==id);
  saveState();
  closeModal('eventModalBg');
  showToast('削除しました');
}

function renderEvents(){
  const list = document.getElementById('eventList');
  const kw = (document.getElementById('eventSearch').value||'').toLowerCase();
  let evs = [...appState.events].sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  if(kw){
    evs = evs.filter(e => [e.name,e.organizer,e.purpose,e.venue].join(' ').toLowerCase().includes(kw));
  }
  if(evs.length===0){ list.innerHTML = '<div class="empty">イベントがまだありません。右下の＋から追加してください。</div>'; return; }
  list.innerHTML = evs.map(ev=>{
    const parts = ev.participants || [];
    const invited = parts.filter(p=>p.invited).length;
    const attended = parts.filter(p=>p.attendance==='〇 出席').length;
    return `<div class="card" onclick="openEventDetail('${ev.id}')">
      <h3>${esc(ev.name)}</h3>
      <div class="meta">
        ${ev.date? '📅 '+esc(ev.date):''} ${ev.venue? ' / 📍 '+esc(ev.venue):''}<br>
        ${ev.organizer? '主催：'+esc(ev.organizer):''}
        ${ev.purpose? '<br>主旨：'+esc(ev.purpose):''}
      </div>
      <span class="tag org">声掛け ${invited}名</span>
      <span class="tag attend">出席 ${attended}名</span>
    </div>`;
  }).join('');
}
document.getElementById('eventSearch').addEventListener('input', renderEvents);

// ---------- イベント詳細：声掛け選定・出欠管理 ----------
function openEventDetail(id){
  currentEventId = id;
  const ev = appState.events.find(e=>e.id===id);
  if(!ev) return;
  document.getElementById('eventDetailTitle').textContent = ev.name;
  document.getElementById('eventDetailMeta').innerHTML =
    `${ev.date? '📅 '+esc(ev.date):''} ${ev.venue? ' / 📍 '+esc(ev.venue):''}<br>
     ${ev.organizer? '主催：'+esc(ev.organizer)+'　':''}${ev.purpose? '主旨：'+esc(ev.purpose):''}`;
  populateDetailOrgFilter();
  document.getElementById('detailMemberSearch').value = '';
  renderDetailPlist();
  openModal('eventDetailModalBg');
}

function populateDetailOrgFilter(){
  const sel = document.getElementById('detailFilterOrg');
  const orgs = [...new Set(appState.members.map(m=>m.org).filter(Boolean))].sort();
  sel.innerHTML = '<option value="">所属：すべて</option>' + orgs.map(o=>`<option>${esc(o)}</option>`).join('');
}
document.getElementById('detailMemberSearch').addEventListener('input', renderDetailPlist);
document.getElementById('detailFilterOrg').addEventListener('change', renderDetailPlist);

function memberHistoryInfo(memberId, excludeEventId){
  const past = appState.events.filter(e=>e.id!==excludeEventId)
    .flatMap(e => (e.participants||[]).filter(p=>p.memberId===memberId).map(p=>({date:e.date, attendance:p.attendance})));
  const attendedCount = past.filter(p=>p.attendance==='〇 出席').length;
  const lastDate = past.map(p=>p.date).filter(Boolean).sort().pop();
  return { total: past.length, attendedCount, lastDate };
}

function renderDetailPlist(){
  const ev = appState.events.find(e=>e.id===currentEventId);
  if(!ev) return;
  const kw = (document.getElementById('detailMemberSearch').value||'').toLowerCase();
  const orgFilter = document.getElementById('detailFilterOrg').value;
  let members = [...appState.members];
  if(kw) members = members.filter(m=>[m.name,m.org,m.industry].join(' ').toLowerCase().includes(kw));
  if(orgFilter) members = members.filter(m=>m.org===orgFilter);
  members.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));

  const wrap = document.getElementById('detailPlist');
  if(members.length===0){ wrap.innerHTML = '<div class="empty">該当するメンバーがいません</div>'; return; }

  wrap.innerHTML = members.map(m=>{
    const p = (ev.participants||[]).find(p=>p.memberId===m.id);
    const checked = !!p;
    const hist = memberHistoryInfo(m.id, ev.id);
    const histTag = hist.total>0
      ? `<span class="tag count">過去${hist.total}回 / 出席${hist.attendedCount}回${hist.lastDate? ' (最終'+hist.lastDate+')':''}</span>`
      : `<span class="tag noattend">声掛け履歴なし</span>`;
    return `<div class="prow">
      <input type="checkbox" ${checked?'checked':''} onchange="toggleParticipant('${m.id}', this.checked)">
      <div class="pinfo">
        <div class="pname" onclick="togglePdetail('${m.id}')">${esc(m.name)} ${m.org? '<span class="pmeta">'+esc(m.org)+'</span>':''}</div>
        <div class="pmeta">${[m.industry,m.ageGroup,m.gender].filter(Boolean).join(' / ')} ${m.drink? ' / '+esc(m.drink):''}</div>
        ${histTag}
        ${m.note? '<div class="pmeta">📝 '+esc(m.note)+'</div>':''}
        <div class="pdetail ${checked?'open':''}" id="pdetail-${m.id}">
          <div class="row2">
            <div class="field"><label>案内日</label><input type="date" value="${p?.inviteDate||''}" onchange="updateParticipantField('${m.id}','inviteDate',this.value)"></div>
            <div class="field"><label>出欠</label>
              <select onchange="updateParticipantField('${m.id}','attendance',this.value)">
                <option value="">未定</option>
                <option ${p?.attendance==='〇 出席'?'selected':''}>〇 出席</option>
                <option ${p?.attendance==='× 欠席'?'selected':''}>× 欠席</option>
              </select>
            </div>
          </div>
          <div class="row2">
            <div class="field"><label>返信日</label><input type="date" value="${p?.replyDate||''}" onchange="updateParticipantField('${m.id}','replyDate',this.value)"></div>
            <div class="field"><label>案内担当</label><input type="text" value="${esc(p?.inviter||'')}" onchange="updateParticipantField('${m.id}','inviter',this.value)"></div>
          </div>
          <div class="field"><label>備考</label><input type="text" value="${esc(p?.note||'')}" onchange="updateParticipantField('${m.id}','note',this.value)"></div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function togglePdetail(memberId){
  const el = document.getElementById('pdetail-'+memberId);
  if(el) el.classList.toggle('open');
}

function toggleParticipant(memberId, checked){
  const ev = appState.events.find(e=>e.id===currentEventId);
  if(!ev) return;
  ev.participants = ev.participants || [];
  const existing = ev.participants.find(p=>p.memberId===memberId);
  if(checked && !existing){
    ev.participants.push({ memberId, invited:true, attendance:'', inviteDate:'', replyDate:'', inviter:'', note:'' });
  } else if(!checked && existing){
    ev.participants = ev.participants.filter(p=>p.memberId!==memberId);
  }
  saveState();
  renderDetailPlist();
  renderEvents();
}

function updateParticipantField(memberId, field, value){
  const ev = appState.events.find(e=>e.id===currentEventId);
  if(!ev) return;
  const p = (ev.participants||[]).find(p=>p.memberId===memberId);
  if(!p) return;
  p[field] = value;
  saveState();
  if(field==='attendance') renderEvents();
}

// ============================================================
//  メンバー関連
// ============================================================
function openNewMemberModal(){
  document.getElementById('memberModalTitle').textContent = '新規メンバー';
  ['memberId','memberName','memberOrg','memberIndustry','memberContact','memberReferrer','memberNote']
    .forEach(id=>document.getElementById(id).value='');
  document.getElementById('memberAge').value='';
  document.getElementById('memberGender').value='';
  document.getElementById('memberDrink').value='';
  document.getElementById('memberDeleteBtn').style.display='none';
  openModal('memberModalBg');
}

function openEditMemberModal(id){
  const m = appState.members.find(x=>x.id===id);
  if(!m) return;
  document.getElementById('memberModalTitle').textContent = 'メンバー編集';
  document.getElementById('memberId').value = m.id;
  document.getElementById('memberName').value = m.name||'';
  document.getElementById('memberOrg').value = m.org||'';
  document.getElementById('memberIndustry').value = m.industry||'';
  document.getElementById('memberAge').value = m.ageGroup||'';
  document.getElementById('memberGender').value = m.gender||'';
  document.getElementById('memberDrink').value = m.drink||'';
  document.getElementById('memberContact').value = m.contact||'';
  document.getElementById('memberReferrer').value = m.referrer||'';
  document.getElementById('memberNote').value = m.note||'';
  document.getElementById('memberDeleteBtn').style.display='inline-block';
  openModal('memberModalBg');
}

function saveMember(){
  const name = document.getElementById('memberName').value.trim();
  if(!name){ alert('氏名を入力してください'); return; }
  const id = document.getElementById('memberId').value;
  const data = {
    name,
    org: document.getElementById('memberOrg').value.trim(),
    industry: document.getElementById('memberIndustry').value.trim(),
    ageGroup: document.getElementById('memberAge').value,
    gender: document.getElementById('memberGender').value,
    drink: document.getElementById('memberDrink').value,
    contact: document.getElementById('memberContact').value.trim(),
    referrer: document.getElementById('memberReferrer').value.trim(),
    note: document.getElementById('memberNote').value.trim(),
  };
  if(id){
    Object.assign(appState.members.find(m=>m.id===id), data);
  } else {
    appState.members.push({ id: genId(), createdAt: Date.now(), ...data });
  }
  saveState();
  closeModal('memberModalBg');
  showToast('保存しました');
}

function deleteMember(){
  const id = document.getElementById('memberId').value;
  if(!confirm('このメンバーを削除しますか？各イベントの参加記録からも削除されます。')) return;
  appState.members = appState.members.filter(m=>m.id!==id);
  appState.events.forEach(e=>{ e.participants = (e.participants||[]).filter(p=>p.memberId!==id); });
  saveState();
  closeModal('memberModalBg');
  showToast('削除しました');
}

function populateMemberFilters(){
  const orgs = [...new Set(appState.members.map(m=>m.org).filter(Boolean))].sort();
  const inds = [...new Set(appState.members.map(m=>m.industry).filter(Boolean))].sort();
  const ages = ['20代','30代','40代','50代','60代','70代以上'];
  const fo = document.getElementById('filterOrg');
  const fi = document.getElementById('filterIndustry');
  const fa = document.getElementById('filterAge');
  const keepOrg = fo.value, keepInd = fi.value, keepAge = fa.value;
  fo.innerHTML = '<option value="">所属：すべて</option>' + orgs.map(o=>`<option>${esc(o)}</option>`).join('');
  fi.innerHTML = '<option value="">業種：すべて</option>' + inds.map(i=>`<option>${esc(i)}</option>`).join('');
  fa.innerHTML = '<option value="">年代：すべて</option>' + ages.map(a=>`<option>${a}</option>`).join('');
  fo.value = keepOrg; fi.value = keepInd; fa.value = keepAge;
}

function renderMembers(){
  populateMemberFilters();
  const kw = (document.getElementById('memberSearch').value||'').toLowerCase();
  const fOrg = document.getElementById('filterOrg').value;
  const fInd = document.getElementById('filterIndustry').value;
  const fAge = document.getElementById('filterAge').value;
  const fHist = document.getElementById('filterHistory').value;

  let members = [...appState.members];
  if(kw) members = members.filter(m=>[m.name,m.org,m.industry].join(' ').toLowerCase().includes(kw));
  if(fOrg) members = members.filter(m=>m.org===fOrg);
  if(fInd) members = members.filter(m=>m.industry===fInd);
  if(fAge) members = members.filter(m=>m.ageGroup===fAge);
  if(fHist){
    members = members.filter(m=>{
      const h = memberHistoryInfo(m.id);
      return fHist==='has' ? h.total>0 : h.total===0;
    });
  }
  members.sort((a,b)=>(a.name||'').localeCompare(b.name||'','ja'));

  const list = document.getElementById('memberList');
  if(members.length===0){ list.innerHTML = '<div class="empty">該当するメンバーがいません</div>'; return; }
  list.innerHTML = members.map(m=>{
    const h = memberHistoryInfo(m.id);
    return `<div class="card" onclick="openEditMemberModal('${m.id}')">
      <h3>${esc(m.name)}</h3>
      <div class="meta">
        ${[m.org].filter(Boolean).join(' ')}<br>
        ${[m.industry,m.ageGroup,m.gender].filter(Boolean).join(' / ')}
        ${m.drink? ' / 🍶 '+esc(m.drink):''}
      </div>
      ${h.total>0? `<span class="tag count">参加${h.total}回・出席${h.attendedCount}回${h.lastDate? '（最終'+h.lastDate+'）':''}</span>` : `<span class="tag noattend">声掛け履歴なし</span>`}
      ${m.note? '<div class="meta">📝 '+esc(m.note)+'</div>':''}
    </div>`;
  }).join('');
}
['memberSearch'].forEach(id=>document.getElementById(id).addEventListener('input', renderMembers));
['filterOrg','filterIndustry','filterAge','filterHistory'].forEach(id=>document.getElementById(id).addEventListener('change', renderMembers));

// ============================================================
//  出力機能
// ============================================================
function esc(s){
  if(s===undefined || s===null) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function populateExportEventSelect(){
  const sel = document.getElementById('exportEventSelect');
  const evs = [...appState.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  sel.innerHTML = evs.map(e=>`<option value="${e.id}">${esc(e.date||'日付未定')} ${esc(e.name)}</option>`).join('') || '<option value="">イベントがありません</option>';
}

function memberRow(m){
  const h = memberHistoryInfo(m.id);
  return {
    '氏名': m.name||'', '所属': m.org||'', '業種': m.industry||'', '年代': m.ageGroup||'',
    '性別': m.gender||'', 'お酒': m.drink||'', '連絡先': m.contact||'', '紹介者': m.referrer||'',
    '過去参加回数': h.total, '出席回数': h.attendedCount, '最終参加日': h.lastDate||'',
    '備考': m.note||''
  };
}

function exportMembersExcel(){
  if(appState.members.length===0){ alert('メンバーが登録されていません'); return; }
  const rows = appState.members.map(memberRow);
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'メンバー名簿');
  XLSX.writeFile(wb, `メンバー名簿_${todayStr()}.xlsx`);
}

function participantRows(ev){
  return (ev.participants||[]).map(p=>{
    const m = appState.members.find(mm=>mm.id===p.memberId) || {};
    return {
      '氏名': m.name||'(削除済み)', '所属': m.org||'', '業種': m.industry||'',
      '出欠': p.attendance||'未定', '案内日': p.inviteDate||'', '返信日': p.replyDate||'',
      '案内担当': p.inviter||'', '備考': p.note||''
    };
  });
}

function exportAllEventsExcel(){
  if(appState.events.length===0){ alert('イベントが登録されていません'); return; }
  const wb = XLSX.utils.book_new();
  const summary = appState.events.map(e=>({
    'イベント名': e.name, '開催日': e.date||'', '場所': e.venue||'', '主催': e.organizer||'',
    '主旨': e.purpose||'', '声掛け人数': (e.participants||[]).length,
    '出席人数': (e.participants||[]).filter(p=>p.attendance==='〇 出席').length
  }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summary), 'イベント一覧');
  appState.events.forEach((e,i)=>{
    const rows = participantRows(e);
    if(rows.length===0) return;
    let sheetName = (e.date? e.date+' ':'') + e.name;
    sheetName = sheetName.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,31) || ('event'+i);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), sheetName);
  });
  XLSX.writeFile(wb, `イベント全件_${todayStr()}.xlsx`);
}

function exportSingleEventExcel(){
  const id = document.getElementById('exportEventSelect').value;
  const ev = appState.events.find(e=>e.id===id);
  if(!ev){ alert('イベントを選択してください'); return; }
  const rows = participantRows(ev);
  if(rows.length===0){ alert('このイベントには参加者記録がありません'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '参加者リスト');
  XLSX.writeFile(wb, `${ev.name}_参加者リスト.xlsx`);
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
}

function printMembers(){
  if(appState.members.length===0){ alert('メンバーが登録されていません'); return; }
  const rows = appState.members.map(memberRow);
  const cols = Object.keys(rows[0]);
  renderPrintTable('メンバー名簿', cols, rows);
}

function printSingleEvent(){
  const id = document.getElementById('exportEventSelect').value;
  const ev = appState.events.find(e=>e.id===id);
  if(!ev){ alert('イベントを選択してください'); return; }
  const rows = participantRows(ev);
  if(rows.length===0){ alert('このイベントには参加者記録がありません'); return; }
  const cols = Object.keys(rows[0]);
  renderPrintTable(`${ev.name}　参加者リスト（${ev.date||''}）`, cols, rows);
}

function renderPrintTable(title, cols, rows){
  const area = document.getElementById('printArea');
  area.innerHTML = `<h2>${esc(title)}</h2>
    <table class="printtable">
      <thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')}</tbody>
    </table>`;
  window.print();
}

// ============================================================
//  全体描画
// ============================================================
function renderAll(){
  renderEvents();
  renderMembers();
  populateExportEventSelect();
}

</script>
